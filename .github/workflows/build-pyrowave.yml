name: Build PyroWave branch (compile check)

on:
  push:
    branches: [pyrowave]
  workflow_dispatch: {}

jobs:
  build-simulator:
    # Generic iOS device destination, signing disabled: this project's
    # VoidLink scheme has no simulator destination configured (only a
    # physical-device one), so this is a compile-only check, not something
    # that can run. Switch to a real device build with signing once clean.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: List installed Xcode versions
        run: ls /Applications | grep -i xcode

      - name: xcodebuild version (default selection)
        run: xcodebuild -version

      - name: List available schemes
        run: xcodebuild -list -project VoidLink.xcodeproj | tee schemes.log

      # No separate -resolvePackageDependencies step: that phase alone doesn't
      # run SPM build-tool-plugin/prebuild scripts the way a real build
      # action does, which is a known cause of exactly this "module map file
      # not found" error for packages (like CocoaLumberjack, here consumed by
      # SVGKit) that generate their modulemap as a build step rather than
      # having a static one. Let the build action resolve on its own instead.
      #
      # Also try up to 3 passes: -target manual-order building has processed
      # SVGKit before its own CocoaLumberjack dependency in every attempt so
      # far (confirmed not a parallelism race -- -jobs 1 failed *faster*, not
      # slower), but a pass that already has CocoaLumberjack's build products
      # on disk from a *previous* pass no longer needs the ordering to be
      # right. If this doesn't clear it in 3 tries, it needs a real scheme
      # (built from Xcode's GUI) or Xcode's package-cache tooling -- see
      # docs/pyrowave-ios-plan.md.
      - name: Best-effort full xcodebuild (informational only)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          SUCCESS=0
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            xcodebuild build \
              -target VoidLink \
              -project VoidLink.xcodeproj \
              -sdk iphonesimulator \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              > "build_attempt${attempt}.log" 2>&1 || true
            if grep -q "BUILD SUCCEEDED" "build_attempt${attempt}.log"; then
              echo "BUILD SUCCEEDED on attempt $attempt"
              SUCCESS=1
              echo "::endgroup::"
              break
            else
              echo "Attempt $attempt did not succeed."
              tail -n 60 "build_attempt${attempt}.log"
            fi
            echo "::endgroup::"
          done
          cat build_attempt*.log > build.log
          if [ "$SUCCESS" -eq 1 ]; then
            echo "BUILD SUCCEEDED"
          else
            echo "BUILD FAILED after 3 attempts (see build.log artifact for full output)"
          fi

      - name: Syntax-check PyroWave files directly (clang, bypassing SVGKit)
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          FAIL=0

          echo "=== Objective-C++ (pyrowave-metal, vendored decoder) ==="
          for f in third_party/pyrowave-metal/pyrowave_common.mm third_party/pyrowave-metal/pyrowave_decoder.mm; do
            echo "--- $f ---"
            clang++ -fsyntax-only -fobjc-arc -x objective-c++ -std=gnu++17 \
              -isysroot "$SDK" -target arm64-apple-ios17.0-simulator \
              -I third_party/pyrowave-metal \
              -F "$SDK/System/Library/Frameworks" \
              "$f" 2>&1 || FAIL=1
          done

          echo "=== C++ (pyrowave bitstream) ==="
          clang++ -fsyntax-only -x c++ -std=gnu++17 \
            -isysroot "$SDK" -target arm64-apple-ios17.0-simulator \
            -I third_party/pyrowave-metal \
            third_party/pyrowave-metal/pyrowave_bitstream.cpp 2>&1 || FAIL=1

          echo "=== Objective-C (our renderer) ==="
          clang -fsyntax-only -fobjc-arc -fmodules -x objective-c \
            -isysroot "$SDK" -target arm64-apple-ios17.0-simulator \
            -I third_party/pyrowave-metal \
            -I VoidLink/Stream \
            -I VoidLink/Utility \
            -I moonlight-common/moonlight-common-c/src \
            -I libs/opus/include/opus \
            -F "$SDK/System/Library/Frameworks" \
            VoidLink/Stream/PyroWaveDecoderRenderer.m 2>&1 || FAIL=1

          echo "=== Metal shader (our present kernel) ==="
          if xcrun -sdk iphonesimulator metal -c VoidLink/Metal/PresentPyroWavePlanes.metal \
            -o /tmp/PresentPyroWavePlanes.air 2>&1; then
            echo "Metal shader compiled cleanly."
          else
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "One or more PyroWave files failed to syntax-check -- see errors above."
            exit 1
          fi
          echo "All PyroWave files syntax-checked cleanly."

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
