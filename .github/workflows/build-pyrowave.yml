name: Build PyroWave branch (compile check)

on:
  push:
    branches: [pyrowave]
  workflow_dispatch: {}

jobs:
  build-simulator:
    # Simulator + no code signing: fastest possible real-compiler feedback
    # while the PyroWave integration is still being iterated on. Switch to a
    # device build with signing once this is clean.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true

      - name: xcodebuild version
        run: xcodebuild -version

      - name: List available schemes
        run: xcodebuild -list -project VoidLink.xcodeproj | tee schemes.log

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project VoidLink.xcodeproj \
            -scheme VoidLink || \
          xcodebuild -resolvePackageDependencies \
            -project VoidLink.xcodeproj \
            -target VoidLink

      - name: Build VoidLink (iOS Simulator, no signing)
        timeout-minutes: 15
        run: |
          set -o pipefail
          echo "--- Available runtimes ---"
          xcrun simctl list runtimes available
          echo "--- Available iOS devices ---"
          xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | "\(.key): \(.value | map(.name) | join(", "))"'

          SIM_UDID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .value[0].udid' | head -1)
          echo "Using simulator UDID: $SIM_UDID"
          if grep -qE "^[[:space:]]+VoidLink$" schemes.log; then
            BUILD_ARG="-scheme VoidLink"
          else
            BUILD_ARG="-target VoidLink"
          fi
          echo "Building with: $BUILD_ARG"
          xcodebuild build \
            $BUILD_ARG \
            -project VoidLink.xcodeproj \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          BUILD_STATUS=$?
          echo "xcodebuild exit status: $BUILD_STATUS"
          if grep -q "BUILD SUCCEEDED" build.log; then
            echo "BUILD SUCCEEDED"
          else
            echo "BUILD FAILED"
            tail -n 400 build.log
            exit 1
          fi

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
